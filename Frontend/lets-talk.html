    <title>Contact</title>

<body>
    <div id="minicircle"></div>
    <div id="main" data-scroll-container>
        <header id="nav" data-scroll-section>
            <a href="index.html" class="nav-logo">Tanmay</a>

                <a href="paper-details.html">Papers</a>

            </div>

  <main class="contact-workspace" data-scroll-section>
    <div class="contact-header">
        <div class="bounding">
            <h1 class="boundingelem page-main-title">Let's Talk</h1>
        </div>
        <p class="contact-subtitle">Have any project Idea in mind? Let's discuss!</p>
        <p class="contact-subtitle">Also can give feedback!!</p>
    </div>

    <form id="portfolio-form">
        <div class="input-group">
            <label for="form-name">Name <span class="required-star">*</span></label>
            <input type="text" id="form-name" placeholder="Your name" required>
        </div>

        <div class="input-group">
            <label for="form-email">Email <span class="required-star">*</span></label>
            <input type="email" id="form-email" placeholder="yourname@domain.com" required>
        </div>

        <div class="input-group">
            <label for="form-message">Message <span class="required-star">*</span></label>
            <textarea id="form-message" rows="4" placeholder="Tell me about your project..." required></textarea>
        </div>

        <div class="form-submit-row">
            <button type="submit" class="magnetic-button">
                <span class="magnetic-text">Send Message</span>
            </button>
        </div>
    </form>
            <footer class="contact-footer-row">
                <div class="social-links-horizon">
                    <a href="https://www.linkedin.com/in/tanmay-pansare-5b402b33a" target="_blank" class="social-anchor"><i class="ri-linkedin-box-fill"></i>LinkedIn </a>

                    <a href="https://www.instagram.com/tanmaypansare208/?__pwa=1" target="_blank" class="social-anchor"><i class="ri-instagram-fill"></i>Instagram </a>
                </div>
                </footer>
        </main>
    </div>
